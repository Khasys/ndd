# Durées du cycle de vie après expiration, en jours calendaires.
#
#   auto_renew_grace : période après l'expiration pendant laquelle le titulaire peut
#                      encore renouveler au tarif normal. Le registrar peut supprimer
#                      le nom avant la fin : l'estimation tirée de cette valeur est
#                      une date au plus tard.
#   redemption       : période de restauration payante après suppression.
#   pending_delete   : délai entre la fin de la rédemption et la libération.
#   drop_time_utc    : heure UTC à laquelle le registre commence à supprimer les noms du jour.
#
# Une clé absente signifie « valeur introuvable ou ambiguë ». Dans ce cas l'appli
# n'affiche aucune estimation de libération pour ce TLD.
#
# Consultation : 2026-10-12 (.com, .net, .fr), 2026-10-15 (.org, .info, .biz), 2026-10-17 (.app, .dev, .xyz). Les pages ont été lues au travers des extraits d'un
# moteur de recherche, l'accès direct aux sites ICANN et Afnic étant bloqué depuis
# l'environnement de développement. À relire sur les documents d'origine.

[com]
# https://www.icann.org/en/registry-agreements/com/com-registry-agreement-appendix-7-1-12-2012-en
# (consulté le 2026-10-12) : « The current value of the Auto-Renew Grace Period is 45 calendar days »
auto_renew_grace = 45
# Même source : « The current length of this Redemption Period is 30 calendar days »
redemption = 30
# Même source : « The current length of this Pending Delete Period is five calendar days »
pending_delete = 5
# Début de la fenêtre quotidienne de suppression, heure UTC. Source de presse, pas d'annonce Verisign trouvée :
# https://domainnamewire.com/2026/09/09/verisign-changes-drop-time-for-com-and-net-domains/
# (consulté le 2026-10-12) : à partir du 1er octobre, début des suppressions vers 12:00 UTC.
drop_time_utc = "12:00"

[net]
# https://www.icann.org/en/registry-agreements/net/net-registry-agreement-appendix-7-functional-and-performance-specifications-01-07-2011-en
# (consulté le 2026-10-12) : Auto-Renew Grace Period de 45 jours calendaires
auto_renew_grace = 45
# Même source : Redemption Period de 30 jours calendaires
redemption = 30
# Même source : Pending Delete Period de cinq jours calendaires
pending_delete = 5
# Début de la fenêtre quotidienne de suppression, heure UTC. Source de presse, pas d'annonce Verisign trouvée :
# https://domainnamewire.com/2026/09/09/verisign-changes-drop-time-for-com-and-net-domains/
# (consulté le 2026-10-12) : à partir du 1er octobre, début des suppressions vers 12:00 UTC.
drop_time_utc = "12:00"

[org]
# https://www.icann.org/en/registry-agreements/org/org-agreement-appendix-7--functional-specifications--22-august-2013-22-8-2013-en
# et https://www.icann.org/en/registry-agreements/org/org-agreement-appendix-7-1-3-2012-en
# (consultés le 2026-10-15) : « The current value of the Auto-Renew Grace Period is 45 calendar days »
auto_renew_grace = 45
# https://pir.org/for-orgs/faq/ (consulté le 2026-10-15) : « 30-day Redemption Grace Period »
redemption = 30
# Même page PIR : « 5-day Pending Delete Period »
pending_delete = 5
# drop_time_utc : absent. Seules des heures relevées sur des forums ont été trouvées, aucune du registre.

[info]
# https://www.icann.org/en/registry-agreements/info/info-agreement-appendix-7--functional-specifications--22-august-2013-22-8-2013-en
# (consulté le 2026-10-15) : Auto-Renew Grace Period de 45 jours calendaires, confirmé par le registre :
# https://identity.digital/help-articles/grace-periods-explained (« 45 calendar days following the completion of the auto-renewal »)
auto_renew_grace = 45
# Même appendice ICANN : « The current length of this Redemption Period is 30 calendar days »
redemption = 30
# Même appendice : période de suppression de cinq jours après la rédemption. La page d'aide d'Identity Digital
# emploie « Pending Delete » pour les 30 jours de rédemption : le contrat ICANN fait foi ici.
pending_delete = 5
# drop_time_utc : absent (aucune source du registre).

[biz]
# https://www.icann.org/en/registry-agreements/biz/biz-agreement-appendix-7--functional-specifications--22-august-2013-22-8-2013-en
# (consulté le 2026-10-15) : « The current value of the Auto-Renew Grace Period is 45 calendar days »
auto_renew_grace = 45
# Même appendice : Redemption Grace Period de 30 jours
redemption = 30
# Même appendice : période de suppression de cinq jours après la rédemption
pending_delete = 5
# drop_time_utc : absent (aucune source du registre).

[app]
# https://registry.google/policies/pricing/app (consulté le 2026-10-17) : renouvellement automatique d'un an
# à l'expiration ; « For 45 days after a domain expires, Registrars can delete the domain »
auto_renew_grace = 45
# Même page : « For 30 days after a domain is deleted, a Registrar may redeem the domain »
redemption = 30
# Durée non écrite par Google Registry. Cinq jours : période de suppression du contrat type ICANN
# des nouvelles extensions, reprise par les registrars. À confirmer.
pending_delete = 5
# drop_time_utc : absent (aucune source du registre).

[dev]
# https://registry.google/policies/pricing/dev (consulté le 2026-10-17) : mêmes règles que .app,
# 45 jours après l'expiration pour supprimer sans payer le renouvellement
auto_renew_grace = 45
# Même page : 30 jours de rédemption après la suppression
redemption = 30
# Comme .app : cinq jours, non écrit par le registre. À confirmer.
pending_delete = 5
# drop_time_utc : absent (aucune source du registre).

[xyz]
# auto_renew_grace : absent. Aucune page du registre XYZ trouvée ; 45 jours est l'usage courant,
# pas une règle publiée. Sans cette valeur, pas d'estimation tant que le nom est seulement expiré.
# Rédemption de 30 jours puis cinq jours de suppression : période de rédemption ICANN imposée
# aux nouvelles extensions, décrite ici (consulté le 2026-10-17) :
# https://archive.icann.org/registrars/redemption-supplement-20feb02.htm
redemption = 30
pending_delete = 5
# drop_time_utc : absent (aucune source du registre).

[fr]
# auto_renew_grace : vide. L'Afnic renouvelle tacitement le nom à l'expiration ;
# la suppression intervient ensuite à l'initiative du registrar, sans délai fixé
# par le registre.
# https://www.afnic.fr/wp-media/uploads/2022/10/Guide-des-procedures-Afnic-VF.pdf (consulté le 2026-10-12)

# https://www.afnic.fr/wp-media/uploads/2024/07/Afnic-Guide-pratique-du-Titulaire.pdf
# (consulté le 2026-10-12) : délai de 30 jours pendant lequel la suppression reste réversible
redemption = 30

# https://www.afnic.fr/wp-media/uploads/2021/03/Afnic-_Guide_Des_procedures.pdf
# (consulté le 2026-10-13, au travers des extraits d'un moteur de recherche) : à la fin des
# 30 jours, « la demande de suppression est irréversible. Le domaine est définitivement
# supprimé et redevient disponible et enregistrable par un autre titulaire ».
# Pas de période de suppression distincte : 0. L'heure n'est pas donnée ; le nom est
# revérifié toutes les 6 h après l'estimation tant qu'il n'est pas libre.
pending_delete = 0

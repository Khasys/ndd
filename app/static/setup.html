<!doctype html>
<html lang="fr"{{THEME_ATTR}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="{{COLOR_SCHEME}}">
<title>Configuration · {{APP_NAME}}</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/style.css?v={{VERSION}}">
</head>
<body>
<main class="login-page">
  <form class="login setup" method="post" action="/setup">
    {{BRAND}}
    <p class="muted">{{MISSING}}. L'appli reste fermée tant que la configuration n'est pas complète.</p>
    <p class="muted">Choisir le mot de passe de connexion. L'appli affiche son hash bcrypt, à copier dans le docker-compose.yml. Rien n'est enregistré.</p>
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required autofocus>
    <label for="confirm">Confirmation</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="12" required>
    <button type="submit" class="btn">Générer le hash</button>
    <p class="error" role="alert">{{ERROR}}</p>
  </form>
</main>
</body>
</html>

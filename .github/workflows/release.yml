name: release

on:
  push:
    tags: ["v*.*.*"]
  # Permet de publier depuis l'onglet Actions sans pousser de tag : le tag est créé à la fin.
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (vX.Y.Z)"
        required: true

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Format de version
        run: echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Tags de l'image
        id: name
        # GHCR exige un nom en minuscules. Docker Hub en plus si ses identifiants sont configurés :
        # Container Manager ne signale les mises à jour que pour les images Docker Hub.
        run: |
          {
            echo "tags<<EOF"
            hub_user="$(printf '%s' "$DOCKERHUB_USERNAME" | LC_ALL=C tr -cd 'A-Za-z0-9_.-')"
            for image in "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/domain-watch" ${hub_user:+"docker.io/${hub_user,,}/domain-watch"}; do
              echo "$image:$VERSION"
              echo "$image:latest"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # Les Synology récents sont en x86_64, certains modèles d'entrée de gamme en ARM64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Connexion Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        # Un caractère invisible collé avec un secret casse l'en-tête d'authentification : on ne garde
        # que les caractères possibles d'un identifiant et d'un jeton Docker Hub.
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          user="$(printf '%s' "$DOCKERHUB_USERNAME" | LC_ALL=C tr -cd 'A-Za-z0-9_.-' | tr 'A-Z' 'a-z')"
          token="$(printf '%s' "$DOCKERHUB_TOKEN" | LC_ALL=C tr -cd 'A-Za-z0-9_-')"
          echo "identifiant : ${#DOCKERHUB_USERNAME} caractères bruts, ${#user} gardés"
          echo "jeton : ${#DOCKERHUB_TOKEN} caractères bruts, ${#token} gardés, préfixe dckr_pat_ : $([[ $token == dckr_pat_* ]] && echo oui || echo non)"
          printf '%s' "$token" | docker login docker.io -u "$user" --password-stdin
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ env.VERSION }}
          tags: ${{ steps.name.outputs.tags }}
      - name: Tag git
        if: github.event_name == 'workflow_dispatch'
        # Le jeton du workflow ne peut pas créer un tag sur un commit qui modifie un workflow :
        # simple repère dans l'historique, l'image est déjà publiée à ce stade.
        continue-on-error: true
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

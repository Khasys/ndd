name: release

on:
  push:
    tags: ["v*.*.*"]
  # Permet de publier depuis l'onglet Actions sans pousser de tag : le tag est créé à la fin.
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (vX.Y.Z)"
        required: true

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Format de version
        run: echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nom de l'image
        id: name
        # GHCR exige un nom en minuscules.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/domain-watch" >> "$GITHUB_OUTPUT"
      # Les Synology récents sont en x86_64, certains modèles d'entrée de gamme en ARM64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ env.VERSION }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ env.VERSION }}
            ${{ steps.name.outputs.image }}:latest
      - name: Tag git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
